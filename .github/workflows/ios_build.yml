name: Build iOS App for Appetize

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build KMP iOS Framework
      run: |
        chmod +x gradlew
        ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: |
        cat << 'EOF' > project.yml
        name: iosApp
        options:
          bundleIdPrefix: com.pfe.connectcoach
        targets:
          iosApp:
            type: application
            platform: iOS
            deploymentTarget: "15.0"
            sources:
              - iosApp
            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: com.pfe.connectcoach.iosApp
                FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/composeApp/build/bin/iosSimulatorArm64/debugFramework
                OTHER_LDFLAGS: $(inherited) -framework composeApp
        EOF
        xcodegen generate

    - name: Build iOS App with Xcode
      run: |
        xcodebuild -project iosApp.xcodeproj \
                   -scheme iosApp \
                   -sdk iphonesimulator \
                   -configuration Debug \
                   -derivedDataPath build/ \
                   ONLY_ACTIVE_ARCH=NO

    - name: Compress .app bundle
      run: |
        cd build/Build/Products/Debug-iphonesimulator
        zip -r iosApp.app.zip iosApp.app

    - name: Upload Artifact for Appetize
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: build/Build/Products/Debug-iphonesimulator/iosApp.app.zip
